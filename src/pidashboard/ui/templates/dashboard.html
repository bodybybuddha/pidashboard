<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiDashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, #1e293b, var(--bg));
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      padding: 20px;
    }
    .pane {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
    }
    .card h3 {
      margin: 0 0 6px;
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .card p {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 700;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <aside class="pane">
      <h2>Controls</h2>
      <p>Mode: <strong>{{ state.mode }}</strong></p>
      <p>Updated: {{ state.updated_at }}</p>
    </aside>
    <section class="pane">
      <h2>Cards</h2>
      <div class="cards">
        {% for card in cards %}
          <article class="card" id="card-{{ card.card_id }}">
            <h3>{{ card.title }}</h3>
            <p>{{ card.body }}</p>
          </article>
        {% endfor %}
      </div>
    </section>
  </main>
</body>
</html>
